[platformio]
default_envs = esp32-8048S070C

[env:esp32-8048S070C]
platform = espressif32@6.13.0
board = esp32-8048S070C
framework = arduino
monitor_speed = 115200

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -D LV_CONF_PATH=${PROJECT_INCLUDE_DIR}/lv_conf.h

build_src_filter =
    +<*>
    -<touch_display_test.cpp>

lib_deps =
    lvgl/lvgl@9.2.2
    https://github.com/rzeldent/esp32-smartdisplay.git#327322c80430b9fedddc870f0de60dac03194ebd

[env:touch-display-check]
platform = espressif32@6.13.0
board = esp32-8048S070C
framework = arduino
monitor_speed = 115200

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -D LV_CONF_PATH=${PROJECT_INCLUDE_DIR}/lv_conf.h

build_src_filter =
    -<*>
    +<touch_display_test.cpp>
    +<board/runtime.cpp>
    +<board/st7262_panel_adapter.c>

lib_deps =
    lvgl/lvgl@9.2.2
    https://github.com/rzeldent/esp32-smartdisplay.git#327322c80430b9fedddc870f0de60dac03194ebd

; Arduino 3 / ESP-IDF 5 RGB driver trial. Keep the Arduino 2 environments above
; intact until a physical cold boot proves this candidate works.
[env:rgb-idf5]
extends = env:esp32-8048S070C
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
build_flags =
    ${env:esp32-8048S070C.build_flags}
    -D APP_OWN_ST7262_PANEL=1
lib_deps =
    lvgl/lvgl@9.2.2
    file://lib/esp32_smartdisplay_arduino3

; Same scanout as the functional rollback, with five-second redraw counters.
[env:rgb-idf5-diagnostics]
extends = env:rgb-idf5
build_flags =
    ${env:rgb-idf5.build_flags}
    -D APP_RGB_DIAGNOSTICS=1

; Compare full UI before and after starting network services in one cold boot.
[env:rgb-staged-startup]
extends = env:rgb-idf5-diagnostics
build_flags =
    ${env:rgb-idf5-diagnostics.build_flags}
    -D APP_RGB_STAGED_STARTUP=1

; Controlled FPS experiment: keep the accepted 12.5 MHz scanout, 8-row flush
; chunks and 10-row RGB bounce buffers while doubling only LVGL's draw buffer.
[env:rgb-staged-startup-buffer16]
extends = env:rgb-staged-startup
build_flags =
    ${env:rgb-staged-startup.build_flags}
    -D APP_LVGL_DRAW_BUFFER_ROWS=16

[env:touch-display-check-idf5]
extends = env:touch-display-check
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
build_flags =
    ${env:touch-display-check.build_flags}
    -D APP_OWN_ST7262_PANEL=1
lib_deps =
    lvgl/lvgl@9.2.2
    file://lib/esp32_smartdisplay_arduino3

; Static panel isolation: same RGB path, no calendar/network workers.
[env:rgb-panel-check]
extends = env:touch-display-check-idf5
build_flags =
    ${env:touch-display-check-idf5.build_flags}
    -D APP_RGB_DIAGNOSTICS=1
    -D APP_RGB_PANEL_CHECK=1
